<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kai'Sa deck · official card faces</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07060c">
  <link rel="icon" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Sans+TC:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07060c;
      --gold: #f0c36a;
      --ink: #f7f1ff;
      --muted: #b7a8c9;
      --line: rgba(240, 195, 106, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Source Sans 3", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(155, 92, 255, 0.28), transparent 55%),
        radial-gradient(700px 380px at 110% 0%, rgba(226, 59, 72, 0.22), transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100dvh;
    }
    header {
      position: sticky; top: 0; z-index: 5;
      padding: 14px 16px 12px;
      background: rgba(7, 6, 12, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    h1 {
      font-family: "Cormorant Garamond", "Noto Serif TC", serif;
      font-size: clamp(1.8rem, 7vw, 3rem);
      line-height: 0.95;
    }
    h1 span { color: #d7c4ff; }
    .zh { color: var(--muted); margin: 6px 0 10px; font-size: 0.95rem; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    a.btn, button.btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 14px; border-radius: 999px; font-weight: 700;
      text-decoration: none; border: 1px solid var(--gold); color: #1a1204;
      background: linear-gradient(180deg, #f4d48a, #c7923a);
      font: inherit; cursor: pointer;
    }
    a.ghost { background: transparent; color: var(--gold); }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 10px;
      padding: 16px 12px 48px;
    }
    @media (min-width: 720px) { .grid { grid-template-columns: repeat(3, 1fr); padding: 24px 7vw 64px; } }
    @media (min-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    figure { margin: 0; }
    figure img {
      width: 100%; height: auto; display: block;
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(240,195,106,.22);
      background: #120c18;
    }
    figcaption {
      text-align: center; margin-top: 8px; color: var(--gold);
      font-size: 0.82rem; font-weight: 700;
    }
    .wide { grid-column: span 2; }
    @media (min-width: 1100px) { .wide { grid-column: span 1; } }
    .lightbox {
      position: fixed; inset: 0; background: rgba(4, 3, 8, 0.92);
      display: none; place-items: center; z-index: 20; padding: 12px;
    }
    .lightbox.open { display: grid; }
    .lightbox img { max-width: min(96vw, 520px); max-height: 90dvh; border-radius: 16px; }
    footer { padding: 8px 16px 28px; color: var(--muted); font-size: 0.78rem; }
  </style>
</head>
<body>
  <header>
    <h1>Kai'Sa <span>Origins</span></h1>
    <p class="zh">官方牌面 · 點卡片可放大 · 這頁在手機瀏覽器能開</p>
    <div class="row">
      <a class="btn" href="index.html">Full guide</a>
      <a class="btn ghost" href="https://cdn.jsdelivr.net/gh/cookielolalex/Hellgate-TD@cursor/riftbound-taiwan-guide-036a/pdf/kaisa-card-faces.pdf">PDF</a>
    </div>
  </header>
  <main class="grid" id="binder">
    <figure><img src="assets/official/kaisa-legend.jpg" alt="Daughter of the Void"><figcaption>×1 · 虛空之女</figcaption></figure>
    <figure><img src="assets/official/kaisa-survivor.jpg" alt="Kai'Sa, Survivor"><figcaption>×2 · 倖存者</figcaption></figure>
    <figure><img src="assets/official/legion-rearguard.jpg" alt="Legion Rearguard"><figcaption>×1 · 軍團後衛</figcaption></figure>
    <figure><img src="assets/official/pouty-poro.jpg" alt="Pouty Poro"><figcaption>×1 · 呸呸普羅</figcaption></figure>
    <figure><img src="assets/official/ravenbloom-student.jpg" alt="Ravenbloom Student"><figcaption>×3 · 拉文布魯姆學生</figcaption></figure>
    <figure><img src="assets/official/watchful-sentry.jpg" alt="Watchful Sentry"><figcaption>×3 · 警覺哨兵</figcaption></figure>
    <figure><img src="assets/official/lecturing-yordle.jpg" alt="Lecturing Yordle"><figcaption>×3 · 約德爾教官</figcaption></figure>
    <figure><img src="assets/official/noxus-hopeful.jpg" alt="Noxus Hopeful"><figcaption>×3 · 諾克薩斯新兵</figcaption></figure>
    <figure><img src="assets/official/darius-trifarian.jpg" alt="Darius, Trifarian"><figcaption>×3 · 達瑞斯</figcaption></figure>
    <figure><img src="assets/official/thousand-tailed-watcher.jpg" alt="Thousand-Tailed Watcher"><figcaption>×3 · 千尾監視者</figcaption></figure>
    <figure><img src="assets/official/cleave.jpg" alt="Cleave"><figcaption>×3 · 順劈</figcaption></figure>
    <figure><img src="assets/official/hextech-ray.jpg" alt="Hextech Ray"><figcaption>×3 · 海克斯射線</figcaption></figure>
    <figure><img src="assets/official/retreat.jpg" alt="Retreat"><figcaption>×3 · 擇日再戰</figcaption></figure>
    <figure><img src="assets/official/stupefy.jpg" alt="Stupefy"><figcaption>×3 · 震懾</figcaption></figure>
    <figure><img src="assets/official/falling-star.jpg" alt="Falling Star"><figcaption>×3 · 星落</figcaption></figure>
    <figure><img src="assets/official/smoke-screen.jpg" alt="Smoke Screen"><figcaption>×1 · 煙幕</figcaption></figure>
    <figure><img src="assets/official/icathian-rain.jpg" alt="Icathian Rain"><figcaption>×1 · 艾卡西亞暴雨</figcaption></figure>
    <figure><img src="assets/official/time-warp.jpg" alt="Time Warp"><figcaption>×1 · 時間扭曲</figcaption></figure>
    <figure class="wide"><img src="assets/official/void-gate.jpg" alt="Void Gate"><figcaption>戰場 · 虛空之門</figcaption></figure>
    <figure class="wide"><img src="assets/official/dreaming-tree.jpg" alt="The Dreaming Tree"><figcaption>戰場 · 幻夢之樹</figcaption></figure>
    <figure class="wide"><img src="assets/official/zaun-warrens.jpg" alt="Zaun Warrens"><figcaption>戰場 · 祖安地道</figcaption></figure>
    <figure><img src="assets/official/fury-rune.jpg" alt="Fury Rune"><figcaption>×7 · 熾烈符文</figcaption></figure>
    <figure><img src="assets/official/mind-rune.jpg" alt="Mind Rune"><figcaption>×5 · 靈光符文</figcaption></figure>
  </main>
  <footer>Official faces from playriftbound.com Card Gallery. Art © Riot Games.</footer>
  <div class="lightbox" id="lb" hidden><img alt=""></div>
  <script>
    const lb = document.getElementById("lb");
    const lbImg = lb.querySelector("img");
    document.getElementById("binder").addEventListener("click", (e) => {
      const img = e.target.closest("img");
      if (!img) return;
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lb.hidden = false;
      lb.classList.add("open");
    });
    lb.addEventListener("click", () => { lb.classList.remove("open"); lb.hidden = true; });
  </script>
</body>
</html>
